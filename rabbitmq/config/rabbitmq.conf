# ==============================================================================
# RABBITMQ PRODUCTION HIGH-EFFICIENCY & BOUNDED-MEMORY PROFILE
# ==============================================================================
# Target Host: 1-2 vCPU, 1GB RAM Dedicated VPS / Shared Infrastructure
# Target RAM Baseline: 100 MB – 250 MB steady-state
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK LISTENERS & PROTOCOLS
# ------------------------------------------------------------------------------
# Plaintext AMQP listener (used for internal/private mesh networks)
listeners.tcp.default = 5672

# Native Encrypted AMQPS (TLS/SSL) listener (used across public internet)
listeners.ssl.default = 5671

# Heartbeat interval in seconds (detects severed/dead connections and frees channels)
heartbeat = 60

# Handshake timeout in seconds (prevents slow-client connection pool exhaustion)
handshake_timeout = 10

# Maximum permitted channels per connection (guards against channel leakage)
channel_max = 2047


# ------------------------------------------------------------------------------
# 2. TLS / SSL CERTIFICATES CONFIGURATION (AMQPS :5671)
# ------------------------------------------------------------------------------
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key

# Verification rules (set to verify_none for self-signed CAs without client mTLS)
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.honor_cipher_order   = true

# Enforce secure modern TLS protocol versions only
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2


# ------------------------------------------------------------------------------
# 3. MEMORY ENGINEERING & DISK PAGING (Fixes 1GB+ Memory Bloat)
# ------------------------------------------------------------------------------
# Set a hard absolute memory ceiling (384MB) instead of claiming 40% of host RAM
vm_memory_high_watermark.absolute = 384MB

# Force message paging to NVMe/SSD storage once RAM hits 50% of the watermark (192 MB)
vm_memory_high_watermark_paging_ratio = 0.5

# Disk free space safety limit: pauses publishers if disk drops below 1 GB
disk_free_limit.absolute = 1GB


# ------------------------------------------------------------------------------
# 4. MANAGEMENT PLUGIN & METRICS THROTTLING (Prevents In-Memory ETS Leaks)
# ------------------------------------------------------------------------------
# Switch rate mode from 'detailed' to 'basic' (disables heavy per-message timeseries)
management.rates_mode = basic

# Increase statistic sampling interval from default 5s to 30s
collect_statistics_interval = 30000

# Strict retention policies: limit in-memory metric history to prevent RAM inflation
management.sample_retention_policies.global.minute   = 5
management.sample_retention_policies.global.hour     = 12
management.sample_retention_policies.basic.minute    = 5
management.sample_retention_policies.detailed.10     = 5


# ------------------------------------------------------------------------------
# 5. GENERAL RUNTIME LIMITS
# ------------------------------------------------------------------------------
# Default virtual host
default_vhost = /

# Ensure logs are formatted with ISO-8601 timestamps
log.console = true
log.console.level = info